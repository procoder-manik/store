# Nightly database backup. Add a repository secret named DATABASE_URL (Supabase, Project Settings, Database,
# Connection string, "Session pooler"). Use a PRIVATE repository: the backup contains customer data.
name: Nightly database backup
on:
  schedule:
    - cron: "30 20 * * *"   # 02:30 in Bangladesh
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$PWD:/out" postgres:17 \
            sh -c 'pg_dump "$DATABASE_URL" --no-owner --schema=public --schema=auth -Fc -f /out/backup.dump'
          ls -la backup.dump
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.dump
          retention-days: 14
